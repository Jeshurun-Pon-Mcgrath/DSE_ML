[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "riskbyte-api"
version = "0.1.0"
description = "RiskByte FastAPI service foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "riskbyte-ml==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
database = ["psycopg[binary]>=3.2,<4", "alembic>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskbyte_api = ["py.typed"]
