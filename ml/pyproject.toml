[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "riskbyte-ml"
version = "0.1.0"
description = "RiskByte data intelligence, leakage-safe features and offline supervised experiments"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "pydantic>=2.9,<3", "tzdata>=2025.1", "scikit-learn>=1.6,<2", "scipy>=1.14,<2", "joblib>=1.4,<2"]

[project.optional-dependencies]
boosting = ["xgboost>=3.0,<4"]
explainability = ["shap==0.53.0"]

[project.scripts]
riskbyte-data = "riskbyte_ml.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskbyte_ml = ["py.typed"]
